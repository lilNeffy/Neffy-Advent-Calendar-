<script>

const videos = [
    "videos/day6a.mp4",
    "videos/day6b.mp4"
];

let currentVideo = 0;

const player =
    document.getElementById("video-player");

player.onended = function() {

    currentVideo++;

    if (currentVideo >= videos.length) {
        currentVideo = 0;
    }

    player.src =
        videos[currentVideo];

    player.play();

};

</script>
